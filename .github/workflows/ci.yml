name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, audit, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  http:
    name: HTTP acceptance (production preview, isolated PGlite)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # QA never uses live services; qa:serve also pins these.
      DATABASE_URL: ""
      SMTP_URL: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run qa:setup
      - name: Start QA server
        run: |
          nohup npm run qa:serve -- --production > qa-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/sign-in && exit 0
            sleep 1
          done
          cat qa-server.log
          exit 1
      - run: npm run qa:test -- --production
      - run: npm run qa:http
      - name: Server log
        if: failure()
        run: cat qa-server.log
